<!DOCTYPE html> <html lang="hi"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Simple Video Upload</title> <style> body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 2rem; } .card { max-width: 500px; width: 100%; padding: 1.5rem; border: 1px solid #ddd; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); } h1 { margin-top: 0; font-size: 1.5rem; } label { display:block; font-size:0.9rem; color:#444; margin-top:1rem; } input { margin-top:0.5rem; }button { margin-top:1.5rem; padding:0.75rem 1rem; border:none; border-radius:8px; background:#2563eb; color:white; cursor:pointer; }button:hover { background:#1d4ed8; } </style> </head> <body> <div class="card"> <h1>Simple Video Upload</h1> <p>बस टेस्ट के लिए, dubbing अभी नहीं है.</p> <label> वीडियो चुनें:  <input type="file" accept="video/*" /> </label> <button>Upload (Test)</button> </div> </body> </html>
